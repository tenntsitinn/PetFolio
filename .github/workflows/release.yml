name: Windows portable release
on:
  push:
    tags: ['*.*.*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -ne $version) { throw 'Release requires a tag matching VERSION.' }
      - name: Test
        shell: pwsh
        run: ./test.ps1
      - name: Build portable package
        shell: pwsh
        run: ./package.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $title = (Get-Content RELEASE_NOTES.md -First 1) -replace '^#\s*', ''
          gh release create $version "dist/PetFolio-$version-win-x64.zip" "dist/PetFolio-$version-win-x64.zip.sha256" --verify-tag --title $title --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
